<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Food Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Suez+One&family=Heebo:wght@500;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Suez+One&family=Heebo:wght@400;600;700&family=Assistant:wght@400;600;700&family=Rubik:wght@500;700&display=swap');
  :root{
    --paper:#FAFAF6; --card:#FFFFFF; --ink:#20241D; --ink-soft:#5B6155; --ink-faint:#9A9C8F;
    --accent:#2F6F62; --accent-soft:#DCEAE6; --accent-deep:#1E4C42;
    --warn:#B5562F; --warn-soft:#F4E2D7;
    --gold:#8A6D1F; --gold-soft:#F2EAD0;
    --line:#DEDACC; --line-strong:#C7C2AF;
    --font-display: 'Frank Ruhl Libre', 'Noto Serif Hebrew', 'Frank Ruehl CLM', David, Georgia, serif;
    --font-data: 'IBM Plex Mono','SF Mono',SFMono-Regular,Consolas,'Roboto Mono',monospace;
    --font-ui: 'Assistant', -apple-system, BlinkMacSystemFont,'Segoe UI','Arial Hebrew',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;min-height:100vh;}
  #app{max-width:640px;margin:0 auto;padding:20px 18px 60px;}

  .masthead{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:4px;gap:10px;}
  .masthead h1{font-family:var(--font-display);font-size:25px;font-weight:700;margin:0;letter-spacing:0;}
  html[dir=rtl] .masthead h1{font-size:27px;}
  html[dir=rtl] .section-title,html[dir=rtl] .tab,html[dir=rtl] label.field-label,
  html[dir=rtl] .vital .label,html[dir=rtl] .stat .lab,html[dir=rtl] .modal h3,
  html[dir=rtl] .confidence-tag,html[dir=rtl] .entry .meal-tag{letter-spacing:0;text-transform:none;}
  .right-controls{display:flex;align-items:center;gap:8px;}
  .lang-toggle{display:flex;border:1px solid var(--line-strong);border-radius:14px;overflow:hidden;}
  .lang-toggle button{background:var(--card);border:none;padding:5px 11px;font-size:11px;cursor:pointer;color:var(--ink-faint);font-family:var(--font-ui);}
  .lang-toggle button.active{background:var(--accent);color:#fff;}
  .gear{background:none;border:1px solid var(--line-strong);border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .gear:hover{background:var(--accent-soft);color:var(--accent-deep);border-color:var(--accent);}

  .date-nav{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 0 16px;border-bottom:1px dashed var(--line-strong);margin-bottom:16px;}
  .date-nav button{background:none;border:none;font-size:16px;color:var(--ink-soft);cursor:pointer;width:28px;height:28px;}
  .date-nav button:hover{color:var(--accent);}
  .today-link{font-size:11px;color:var(--accent);cursor:pointer;text-decoration:underline;margin-inline-start:6px;}
  .date-label{font-family:var(--font-data);font-size:14px;min-width:150px;text-align:center;}

  .tabs{display:flex;gap:2px;margin-bottom:18px;}
  .tab{flex:1;text-align:center;padding:8px 0;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);cursor:pointer;border-bottom:2px solid var(--line);}
  .tab.active{color:var(--ink);border-bottom:2px solid var(--accent);font-weight:600;}

  .vitals{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:20px;}
  .vital{background:var(--card);padding:12px 10px;text-align:center;}
  .vital .label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);}
  .vital .value{font-family:var(--font-data);font-size:19px;margin-top:4px;}
  .vital .target{font-family:var(--font-data);font-size:11px;color:var(--ink-faint);}
  .vital .bar{height:3px;background:var(--line);margin-top:6px;border-radius:2px;overflow:hidden;}
  .vital .bar-fill{height:100%;background:var(--accent);}
  .vital.over .bar-fill{background:var(--warn);}
  .vital.hit .bar-fill{background:var(--accent);}

  .section-title{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-faint);margin:22px 0 10px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:16px;}

  .mode-toggle{display:flex;gap:8px;margin-bottom:12px;}
  .mode-btn{flex:1;padding:9px;border:1px solid var(--line-strong);background:var(--card);border-radius:3px;cursor:pointer;font-size:13px;color:var(--ink-soft);font-family:var(--font-ui);}
  .mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  textarea,input[type=text],input[type=number],select,input[type=date],input[type=time]{
    width:100%;padding:9px 10px;border:1px solid var(--line-strong);border-radius:3px;font-family:var(--font-ui);font-size:14px;background:#fff;color:var(--ink);}
  textarea{resize:vertical;min-height:56px;}
  label.field-label{display:block;font-size:11px;color:var(--ink-faint);margin:10px 0 4px;text-transform:uppercase;letter-spacing:0.5px;}

  .btn{display:inline-block;padding:9px 16px;border-radius:3px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:13px;cursor:pointer;font-family:var(--font-ui);}
  .btn:hover{background:var(--accent-deep);}
  .btn.secondary{background:none;color:var(--ink-soft);border-color:var(--line-strong);}
  .btn.secondary:hover{color:var(--ink);border-color:var(--ink-soft);}
  .btn:disabled{opacity:0.5;cursor:default;}
  .btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}

  .photo-drop{border:1px dashed var(--line-strong);border-radius:3px;padding:16px;text-align:center;color:var(--ink-faint);font-size:13px;cursor:pointer;}
  .photo-drop img{max-width:100%;max-height:180px;border-radius:3px;margin-top:8px;}
  .anchor-hint{font-size:11px;color:var(--ink-faint);margin-top:6px;line-height:1.5;}

  .estimate-note{font-size:11px;color:var(--ink-faint);margin-top:8px;font-style:italic;}
  .error-msg{color:var(--warn);font-size:13px;margin-top:8px;}

  .review{margin-top:14px;border-top:1px dashed var(--line-strong);padding-top:14px;}
  .review .items-list{font-size:13px;color:var(--ink-soft);margin-bottom:10px;}
  .portion-row{display:flex;gap:6px;margin:10px 0;align-items:center;flex-wrap:wrap;}
  .portion-row .plabel{font-size:10px;text-transform:uppercase;color:var(--ink-faint);letter-spacing:0.5px;}
  .portion-btn{padding:5px 10px;border:1px solid var(--line-strong);background:var(--card);border-radius:12px;font-size:12px;cursor:pointer;font-family:var(--font-data);color:var(--ink-soft);}
  .portion-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .review-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .review-grid .f{display:flex;flex-direction:column;}
  .review-grid label{font-size:10px;color:var(--ink-faint);text-transform:uppercase;margin-bottom:3px;}
  .review-grid input{font-family:var(--font-data);font-size:14px;padding:6px 8px;}
  .confidence-tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;margin-top:8px;background:var(--accent-soft);color:var(--accent-deep);text-transform:uppercase;letter-spacing:0.5px;}
  .confidence-tag.low{background:var(--warn-soft);color:var(--warn);}

  .flags{margin-top:10px;display:flex;flex-direction:column;gap:5px;}
  .flag{font-size:12px;padding:6px 9px;border-radius:3px;line-height:1.45;}
  .flag.warn{background:var(--warn-soft);color:var(--warn);border-inline-start:3px solid var(--warn);}
  .flag.note{background:var(--gold-soft);color:var(--gold);border-inline-start:3px solid var(--gold);}
  .flag.good{background:var(--accent-soft);color:var(--accent-deep);border-inline-start:3px solid var(--accent);}

  .ceiling-banner{padding:12px 14px;border-radius:3px;margin-bottom:16px;font-size:13px;line-height:1.5;display:flex;align-items:center;gap:10px;}
  .ceiling-banner.over{background:var(--warn);color:#fff;}
  .ceiling-banner.near{background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold);}
  .ceiling-banner .big{font-family:var(--font-data);font-size:19px;font-weight:600;}
  .ceiling-line{position:absolute;left:0;right:0;border-top:2px dashed var(--warn);}
  .ceiling-tag{position:absolute;font-size:9px;color:var(--warn);font-family:var(--font-data);background:var(--card);padding:0 3px;}
  .week-bar.ceilover{background:var(--warn);}

  .fav-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:4px;}
  .fav-chip{flex-shrink:0;border:1px solid var(--line-strong);background:var(--card);border-radius:14px;padding:6px 11px;font-size:12px;cursor:pointer;color:var(--ink-soft);white-space:nowrap;}
  .fav-chip:hover{border-color:var(--accent);color:var(--accent-deep);background:var(--accent-soft);}
  .fav-chip .kc{font-family:var(--font-data);font-size:10px;color:var(--ink-faint);margin-inline-start:5px;}
  .fav-chip .x{margin-inline-start:6px;color:var(--ink-faint);}

  .entry{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);gap:10px;}
  .entry:last-child{border-bottom:none;}
  .entry .meta{flex:1;}
  .entry .meal-tag{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--accent-deep);background:var(--accent-soft);padding:2px 6px;border-radius:2px;}
  .entry .time-tag{font-family:var(--font-data);font-size:10px;color:var(--ink-faint);margin-inline-start:6px;}
  .entry .desc{font-size:14px;margin-top:5px;}
  .entry .macros{font-family:var(--font-data);font-size:11px;color:var(--ink-faint);margin-top:4px;}
  .entry .cals{font-family:var(--font-data);font-size:16px;text-align:end;white-space:nowrap;}
  .entry .act{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:14px;padding-inline-start:8px;}
  .entry .act:hover{color:var(--accent);}
  .entry .act.del:hover{color:var(--warn);}
  .empty-state{color:var(--ink-faint);font-size:13px;padding:20px 0;text-align:center;}

  .week-chart{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:10px;position:relative;}
  .week-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .week-bar{width:100%;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px;}
  .week-bar.over{background:var(--warn);}
  .week-bar.splurge{background:var(--gold);}
  .week-bar-label{font-size:10px;color:var(--ink-faint);margin-top:6px;font-family:var(--font-data);}
  .target-line{position:absolute;left:0;right:0;border-top:1px dashed var(--ink-faint);}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);}
  .stat{background:var(--card);padding:13px 12px;}
  .stat .lab{font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:var(--ink-faint);}
  .stat .val{font-family:var(--font-data);font-size:20px;margin-top:4px;}
  .stat .sub{font-size:11px;color:var(--ink-faint);margin-top:3px;line-height:1.4;}
  .stat .val.good{color:var(--accent);}
  .stat .val.bad{color:var(--warn);}

  .timing-chart{display:flex;align-items:flex-end;gap:2px;height:90px;margin-top:6px;}
  .timing-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;}
  .timing-bar{width:100%;background:var(--accent);border-radius:1px 1px 0 0;min-height:1px;}
  .timing-bar.late{background:var(--gold);}
  .timing-axis{display:flex;gap:2px;margin-top:4px;}
  .timing-axis div{flex:1;font-size:8px;color:var(--ink-faint);text-align:center;font-family:var(--font-data);}

  .weight-form{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}
  .weight-form .f{flex:1;min-width:110px;}
  .weight-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .weight-row .del{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:14px;}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--ink-faint);margin-top:8px;flex-wrap:wrap;}
  .legend span{display:flex;align-items:center;gap:5px;}
  .swatch{width:14px;height:2px;display:inline-block;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(32,36,29,0.4);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-backdrop.open{display:flex;}
  .modal{background:var(--card);border-radius:4px;max-width:440px;width:100%;padding:22px;max-height:90vh;overflow-y:auto;}
  .modal h2{font-family:var(--font-display);font-size:19px;margin:0 0 4px;}
  .modal .sub{font-size:12px;color:var(--ink-faint);margin-bottom:16px;line-height:1.5;}
  .modal h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-faint);margin:20px 0 8px;border-top:1px solid var(--line);padding-top:14px;}
  .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .modal-close-row{display:flex;justify-content:space-between;margin-top:20px;align-items:center;flex-wrap:wrap;gap:10px;}
  .font-picker{display:flex;flex-direction:column;gap:6px;}
  .font-opt{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 12px;border:1px solid var(--line-strong);background:var(--card);border-radius:3px;cursor:pointer;text-align:start;}
  .font-opt.active{border-color:var(--accent);background:var(--accent-soft);}
  .font-opt .fname{font-family:var(--font-ui);font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.5px;flex-shrink:0;}
  .font-opt .fsample{font-size:21px;color:var(--ink);}
  .danger-link{color:var(--warn);font-size:12px;background:none;border:none;cursor:pointer;text-decoration:underline;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;}
  .toast.show{opacity:1;}
</style>
</head>

  const MEAL_I18N={breakfast:'mealBreakfast',lunch:'mealLunch',dinner:'mealDinner',snack:'mealSnack'};

  function tr(k){const l=state.lang||'en';return (I18N[l]&&I18N[l][k]!==undefined)?I18N[l][k]:(I18N.en[k]||k);}
  function trf(k,params){let s=tr(k);Object.keys(params||{}).forEach(p=>{s=s.split('{'+p+'}').join(params[p]);});return s;}

  // ================= Dates =================
  function isoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function displayDate(iso){return new Date(iso+'T00:00:00').toLocaleDateString(locale(),{weekday:'short',month:'short',day:'numeric'});}
  function shiftDate(iso,delta){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+delta);return isoDate(d);}
  function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
  function nowTime(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}

    notes_en:"Adva Lotati's plan:\n• At least 100 g protein a day; never more than 30–40 g in a single meal.\n• 80/20 carbs: 80% of the week low-carb (protein + vegetables), carbs saved for the 20% — evening wine, a bar, a restaurant, one treat meal.\n• Protein in the between-meal snacks (protein drink / bar / Pro yogurt, 20–25 g).\n• Base of every meal is protein + vegetables. Carrots, sweet potato, legumes and cherry tomatoes behave like carbs, not free vegetables.\n• Target loss 0.5 kg/week. Weigh once a week, not daily.\n• Current phase: metabolic adaptation — strength training 3x/week plus aerobic work is the lever, and protein goes up once training starts.",

  // ================= Nutrition estimate =================
  async function estimateNutrition({description,meal,imageBase64,imageMediaType,note}){
    const mealText=mealLabel(meal);
    const langName=state.lang==='he'?'Hebrew':'English';
    const schema='Return ONLY valid JSON (no markdown fences, no commentary) matching exactly: '+
      '{"items":[{"name":"string","portion":"string"}],"calories":number,"protein_g":number,"carbs_g":number,"fat_g":number,"fiber_g":number,"sodium_mg":number,"confidence":"low"|"medium"|"high"}. '+
      'Use standard nutrition-database values for common foods and typical adult portions. Israeli supermarket products and restaurant dishes are likely. '+
      'If portion size is unclear, assume a typical serving and set confidence to "low". '+
      'Write "name" and "portion" in '+langName+'. Numeric fields are plain numbers, no units.';
    let content;
    if(imageBase64){
      content=[{type:'image',source:{type:'base64',media_type:imageMediaType,data:imageBase64}},
        {type:'text',text:'Identify the food(s) in this photo and estimate the nutrition. Meal: '+mealText+'.'+(note?' User note: '+note+'.':'')+' Pay particular attention to portion size; use any fork, hand, or plate in frame as a scale reference.\n\n'+schema}];
    }else{
      content=[{type:'text',text:'Estimate nutrition for this entry. Meal: '+mealText+'. Food: '+description+'\n\n'+schema}];
    }
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content}]})
    });
    if(!resp.ok)throw new Error('Estimate request failed ('+resp.status+')');
    const data=await resp.json();
    const tb=(data.content||[]).find(b=>b.type==='text');
    if(!tb)throw new Error('No estimate returned');
    let clean=tb.text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    return JSON.parse(clean);
  }
  function fileToBase64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=()=>rej(new Error('Could not read image'));r.readAsDataURL(f);});}

  // ================= Plan checking (local, deterministic) =================
  function checkEntry(entry, dayEntriesAfterAdd, splurgeDaysThisWeek){
    const p=state.plan||defaultPlan; const flags=[];
    if(entry.protein_g > p.proteinPerMeal)
      flags.push({sev:'warn',text:trf('flagProteinMeal',{n:Math.round(entry.protein_g),max:p.proteinPerMeal})});
    if(entry.carbs_g > p.carbEntryFlag)
      flags.push({sev:'note',text:trf('flagCarbHigh',{n:Math.round(entry.carbs_g)})});
    if(entry.meal==='snack' && entry.protein_g < 8 && entry.calories > 80)
      flags.push({sev:'note',text:tr('flagSnackProtein')});
    if(entry.time){
      const hr=parseInt(entry.time.split(':')[0],10);
      if(!isNaN(hr) && hr>=p.lateHour) flags.push({sev:'note',text:trf('flagLate',{t:entry.time})});
    }
    const totals=dayTotals(dayEntriesAfterAdd);
    if(p.calorieCeiling>0){
      if(totals.calories>p.calorieCeiling)
        flags.push({sev:'warn',text:trf('ceilingCross',{n:Math.round(totals.calories),c:p.calorieCeiling})});
      else
        flags.push({sev:'note',text:trf('ceilingWouldNear',{n:Math.round(totals.calories),left:Math.round(p.calorieCeiling-totals.calories)})});
    }
    if(totals.protein_g >= p.proteinDaily)
      flags.push({sev:'good',text:trf('flagProteinGood',{n:Math.round(totals.protein_g)})});
    else
      flags.push({sev:'note',text:trf('flagProteinLow',{n:Math.round(totals.protein_g),target:p.proteinDaily,gap:Math.round(p.proteinDaily-totals.protein_g)})});
    if(totals.carbs_g > p.carbSplurgeDay)
      flags.push({sev:splurgeDaysThisWeek>p.splurgeDaysAllowed?'warn':'note',
        text:trf('flagSplurgeUsed',{n:splurgeDaysThisWeek,allowed:p.splurgeDaysAllowed})});
    return flags;
  }

  // ================= Data ops =================
  async function loadLang(){state.lang=(await storeGet('lang'))||'en';applyDir();}

  async function loadPlan(){const p=await storeGet('plan');state.plan=p?{...defaultPlan,...p}:{...defaultPlan};}

  function dayTotals(entries){
    const t={calories:0,protein_g:0,carbs_g:0,fat_g:0,fiber_g:0,sodium_mg:0};
    (entries||[]).forEach(e=>{t.calories+=Number(e.calories)||0;t.protein_g+=Number(e.protein_g)||0;t.carbs_g+=Number(e.carbs_g)||0;t.fat_g+=Number(e.fat_g)||0;t.fiber_g+=Number(e.fiber_g)||0;t.sodium_mg+=Number(e.sodium_mg)||0;});
    return t;
  }

  async function loadWeek(){
    const days=[];
    for(let i=6;i>=0;i--){
      const iso=shiftDate(state.currentDate,-i);
      const entries=(await storeGet('log:'+iso))||[];
      days.push({iso,entries,totals:dayTotals(entries)});
    }
    state.weekDays=days;
  }

  async function loadTiming(){
    const buckets=new Array(24).fill(0); let daysWithData=0;
    for(let i=13;i>=0;i--){
      const iso=shiftDate(state.currentDate,-i);
      const entries=(await storeGet('log:'+iso))||[];
      if(entries.length)daysWithData++;
      entries.forEach(e=>{
        if(!e.time)return;
        const h=parseInt(e.time.split(':')[0],10);
        if(!isNaN(h)&&h>=0&&h<24)buckets[h]+=Number(e.calories)||0;
      });
    }
    state.timingBuckets={buckets,days:Math.max(1,daysWithData)};
  }

  // ================= Trend weight (EWMA) =================
  function computeTrend(weights){
    if(!weights.length)return [];
    const alphaDaily=0.10; const out=[];
    let trend=weights[0].kg;
    out.push({date:weights[0].date,kg:weights[0].kg,trend});
    for(let i=1;i<weights.length;i++){
      const gap=Math.max(1,daysBetween(weights[i-1].date,weights[i].date));
      const a=1-Math.pow(1-alphaDaily,gap);
      trend=trend+a*(weights[i].kg-trend);
      out.push({date:weights[i].date,kg:weights[i].kg,trend});
    }
    return out;
  }
  function trendRate(series){ // kg per week over last 28 days of trend
    if(series.length<2)return null;
    const last=series[series.length-1];
    let ref=null;
    for(let i=series.length-1;i>=0;i--){
      if(daysBetween(series[i].date,last.date)>=14){ref=series[i];break;}
    }
    if(!ref)ref=series[0];
    const days=daysBetween(ref.date,last.date);
    if(days<7)return null;
    return ((last.trend-ref.trend)/days)*7;
  }

  // ================= Render helpers =================
  function fmt(n){return (Math.round(Number(n)||0)).toLocaleString(locale());}
  function fmt1(n){return (Number(n)||0).toFixed(1);}

  function vitalTile(labK,unitK,val,target){
    const t=Number(target);
    const has=target!==''&&target!=null&&!isNaN(t)&&t>0;
    const over=has&&val>t; const pct=has?Math.min(100,(val/t)*100):0;
    return '<div class="vital '+(over?'over':'')+'">'+
      '<div class="label">'+tr(labK)+'</div>'+
      '<div class="value">'+fmt(val)+'<span style="font-size:10px;color:var(--ink-faint);"> '+tr(unitK)+'</span></div>'+
      '<div class="target">'+(has?tr('of')+' '+fmt(t):tr('noTargetSet'))+'</div>'+
      (has?'<div class="bar"><div class="bar-fill" style="width:'+pct+'%"></div></div>':'')+'</div>';
  }

  function flagsHtml(flags){
    if(!flags||!flags.length)return '';

  function scaled(v){return Math.round((Number(v)||0)*state.reviewScale);}

  function renderReview(){
    if(!state.reviewBase)return '';
    const r=state.reviewBase;
    const items=(r.items||[]).map(i=>i.name+(i.portion?' ('+i.portion+')':'')).join(', ');
    const conf=r.confidence==='low'?tr('confLow'):r.confidence==='high'?tr('confHigh'):tr('confMedium');
    const scales=[0.5,0.75,1,1.5,2];
    const preview={meal:r.meal,time:r.time,calories:scaled(r.calories),protein_g:scaled(r.protein_g),
      carbs_g:scaled(r.carbs_g),fat_g:scaled(r.fat_g),fiber_g:scaled(r.fiber_g),sodium_mg:scaled(r.sodium_mg)};
    const withPreview=state.dayEntries.concat([preview]);
    const thr=(state.plan||defaultPlan).carbSplurgeDay;
    const todayWasSplurge=dayTotals(state.dayEntries).carbs_g>thr;
    const todayNowSplurge=dayTotals(withPreview).carbs_g>thr;
    // splurgeCount() already counts today if it was over; only add one if this entry tips it over
    const splurgeDays=splurgeCount()+((!todayWasSplurge&&todayNowSplurge)?1:0);
    const flags=checkEntry(preview,withPreview,splurgeDays);
    return '<div class="review">'+
      '<div class="items-list"><strong>'+tr('identified')+'</strong> '+esc(items||'—')+'</div>'+
      '<div class="portion-row"><span class="plabel">'+tr('portionLabel')+'</span>'+
        scales.map(s=>'<button class="portion-btn '+(state.reviewScale===s?'active':'')+'" data-scale="'+s+'">×'+s+'</button>').join('')+
      '</div>'+
      '<div class="review-grid">'+
        '<div class="f"><label>'+tr('calories')+'</label><input type="number" id="rv-calories" value="'+scaled(r.calories)+'"></div>'+
        '<div class="f"><label>'+tr('protein')+' ('+tr('gUnit')+')</label><input type="number" id="rv-protein" value="'+scaled(r.protein_g)+'"></div>'+
        '<div class="f"><label>'+tr('carbs')+' ('+tr('gUnit')+')</label><input type="number" id="rv-carbs" value="'+scaled(r.carbs_g)+'"></div>'+
        '<div class="f"><label>'+tr('fat')+' ('+tr('gUnit')+')</label><input type="number" id="rv-fat" value="'+scaled(r.fat_g)+'"></div>'+
        '<div class="f"><label>'+tr('fiber')+' ('+tr('gUnit')+')</label><input type="number" id="rv-fiber" value="'+scaled(r.fiber_g)+'"></div>'+
        '<div class="f"><label>'+tr('sodium')+' ('+tr('mgUnit')+')</label><input type="number" id="rv-sodium" value="'+scaled(r.sodium_mg)+'"></div>'+
      '</div>'+
      '<span class="confidence-tag '+(r.confidence==='low'?'low':'')+'">'+conf+' '+tr('confSuffix')+'</span>'+
      flagsHtml(flags)+
      '<div class="btn-row"><button class="btn" id="btn-confirm-add">'+tr('addToLog')+'</button>'+
      '<button class="btn secondary" id="btn-discard">'+tr('discard')+'</button></div>'+
    '</div>';
  }

  function renderLogTab(){
    const totals=dayTotals(state.dayEntries); const s=state.settings||defaultSettings; const p=state.plan||defaultPlan;

    let banner='';
    if(p.calorieCeiling>0 && state.dayEntries.length){
      const diff=totals.calories-p.calorieCeiling;
      if(diff>0){
        banner='<div class="ceiling-banner over"><span class="big">'+fmt(totals.calories)+'</span>'+
          '<span>'+esc(trf('ceilingOver',{c:p.calorieCeiling,n:fmt(totals.calories),over:fmt(diff)}))+'</span></div>';
      }else if(diff>-250){
        banner='<div class="ceiling-banner near"><span class="big">'+fmt(-diff)+'</span>'+
          '<span>'+esc(trf('ceilingNear',{n:fmt(totals.calories),left:fmt(-diff),c:p.calorieCeiling}))+'</span></div>';
      }
    }
    const vitals='<div class="vitals">'+
      vitalTile('calories','kcal',totals.calories,s.calories)+
      vitalTile('protein','gUnit',totals.protein_g,s.protein||p.proteinDaily)+
      vitalTile('carbs','gUnit',totals.carbs_g,s.carbs)+
      vitalTile('fat','gUnit',totals.fat_g,s.fat)+
      vitalTile('fiber','gUnit',totals.fiber_g,s.fiber)+
      vitalTile('sodium','mgUnit',totals.sodium_mg,s.sodium)+'</div>';

    const mealOpts=['breakfast','lunch','dinner','snack'].map(m=>'<option value="'+m+'">'+mealLabel(m)+'</option>').join('');

    const favs=state.favourites.length
      ? '<div class="fav-strip">'+state.favourites.map(f=>
          '<span class="fav-chip" data-fav="'+f.id+'">'+esc(f.description.slice(0,28))+'<span class="kc">'+fmt(f.calories)+'</span><span class="x" data-favdel="'+f.id+'">×</span></span>').join('')+'</div>'
      : '<div class="empty-state" style="padding:8px 0;">'+tr('noFavs')+'</div>';

    const manual='<label class="field-label">'+tr('meal')+'</label><select id="in-meal">'+mealOpts+'</select>'+
      '<label class="field-label">'+tr('time')+'</label><input type="time" id="in-time" value="'+nowTime()+'">'+
      '<label class="field-label">'+tr('whatDidYouEat')+'</label>'+
      '<textarea id="in-desc" placeholder="'+tr('descPlaceholder')+'"></textarea>'+
      '<div class="btn-row"><button class="btn" id="btn-est-manual" '+(state.loading?'disabled':'')+'>'+(state.loading?tr('estimating'):tr('estimate'))+'</button></div>';

    const photo='<label class="field-label">'+tr('meal')+'</label><select id="in-meal-photo">'+mealOpts+'</select>'+
      '<label class="field-label">'+tr('time')+'</label><input type="time" id="in-time-photo" value="'+nowTime()+'">'+
      '<label class="field-label">'+tr('photoOfPlate')+'</label>'+
      '<div class="photo-drop" id="photo-drop">'+(state.photoBase64?'<img src="data:'+state.photoMediaType+';base64,'+state.photoBase64+'">':tr('tapToChoosePhoto'))+'</div>'+
      '<div class="anchor-hint">'+tr('anchorHint')+'</div>'+
      '<input type="file" accept="image/*" id="in-photo-file" style="display:none">'+
      '<label class="field-label">'+tr('optionalNote')+'</label><input type="text" id="in-photo-note" placeholder="'+tr('notePlaceholder')+'">'+
      '<div class="btn-row"><button class="btn" id="btn-est-photo" '+(state.loading||!state.photoBase64?'disabled':'')+'>'+(state.loading?tr('estimating'):tr('estimateFromPhoto'))+'</button></div>';

    const addCard='<div class="section-title">'+tr('favourites')+'</div><div class="card">'+favs+'</div>'+
      '<div class="section-title">'+tr('addEntry')+'</div><div class="card">'+
      '<div class="mode-toggle"><button class="mode-btn '+(state.logMode==='manual'?'active':'')+'" id="mode-manual">'+tr('manual')+'</button>'+
      '<button class="mode-btn '+(state.logMode==='photo'?'active':'')+'" id="mode-photo">'+tr('photo')+'</button></div>'+
      (state.logMode==='manual'?manual:photo)+
      (state.error?'<div class="error-msg">'+esc(state.error)+'</div>':'')+
      '<div class="estimate-note">'+tr('estimateDisclaimer')+'</div>'+renderReview()+'</div>';

    const entries=state.dayEntries.length?state.dayEntries.map(e=>
      '<div class="entry"><div class="meta">'+
        '<span class="meal-tag">'+mealLabel(e.meal)+'</span>'+(e.time?'<span class="time-tag">'+e.time+'</span>':'')+
        '<div class="desc">'+esc(e.description)+'</div>'+
        '<div class="macros">'+tr('abbrProtein')+' '+fmt(e.protein_g)+tr('gUnit')+' · '+tr('abbrCarbs')+' '+fmt(e.carbs_g)+tr('gUnit')+' · '+tr('abbrFat')+' '+fmt(e.fat_g)+tr('gUnit')+' · '+tr('abbrFiber')+' '+fmt(e.fiber_g)+tr('gUnit')+' · '+tr('abbrSodium')+' '+fmt(e.sodium_mg)+tr('mgUnit')+'</div>'+
      '</div><div class="cals">'+fmt(e.calories)+
        '<button class="act" data-star="'+e.id+'" title="'+tr('saveFav')+'">☆</button>'+
        '<button class="act del" data-del="'+e.id+'">×</button></div></div>'
    ).join(''):'<div class="empty-state">'+tr('noEntries')+'</div>';

    const calTarget=Number(s.calories)||0;

    const chart='<div class="section-title">'+tr('last7days')+'</div><div class="card"><div class="week-chart">'+
      (ceil?'<div class="ceiling-line" style="bottom:'+Math.min(100,(ceil/max)*100)+'%"></div>':'')+
      state.weekDays.map(d=>{
        const h=Math.max(2,(d.totals.calories/max)*100);
        const overCeil=ceil&&d.totals.calories>ceil;
        const splurge=d.totals.carbs_g>p.carbSplurgeDay;
        const lab=new Date(d.iso+'T00:00:00').toLocaleDateString(locale(),{weekday:'narrow'});
        return '<div class="week-bar-col"><div class="week-bar '+(overCeil?'ceilover':splurge?'splurge':'')+'" style="height:'+h+'%" title="'+d.iso+'"></div><div class="week-bar-label">'+lab+'</div></div>';
      }).join('')+'</div></div>';

    return banner+vitals+addCard+'<div class="section-title">'+displayDate(state.currentDate)+' — '+tr('logForDay')+'</div><div class="card">'+entries+'</div>'+chart;
  }

  function renderWeekTab(){
    const p=state.plan||defaultPlan; const s=state.settings||defaultSettings;
    const logged=state.weekDays.filter(d=>d.entries.length);
    if(!logged.length)return '<div class="card"><div class="empty-state">'+tr('weekEmpty')+'</div></div>';
    const avgCal=logged.reduce((a,d)=>a+d.totals.calories,0)/logged.length;
    const avgProt=logged.reduce((a,d)=>a+d.totals.protein_g,0)/logged.length;
    const protTarget=Number(s.protein)||p.proteinDaily;
    const protHit=logged.filter(d=>d.totals.protein_g>=protTarget).length;
    const splurge=splurgeCount();

    const stats='<div class="stat-grid">'+
      '<div class="stat"><div class="lab">'+tr('avgCalories')+'</div><div class="val">'+fmt(avgCal)+'</div><div class="sub">'+logged.length+' '+tr('daysLogged')+'</div></div>'+
      '<div class="stat"><div class="lab">'+tr('avgProtein')+'</div><div class="val '+(avgProt>=protTarget?'good':'bad')+'">'+fmt(avgProt)+tr('gUnit')+'</div><div class="sub">'+tr('of')+' '+protTarget+tr('gUnit')+'</div></div>'+
      '<div class="stat"><div class="lab">'+tr('proteinDaysHit')+'</div><div class="val '+(protHit>=logged.length*0.7?'good':'bad')+'">'+protHit+'</div><div class="sub">'+tr('ofDays')+' '+logged.length+'</div></div>'+
      '<div class="stat"><div class="lab">'+tr('carbDaysUsed')+'</div><div class="val '+(splurge<=p.splurgeDaysAllowed?'good':'bad')+'">'+splurge+'</div><div class="sub">'+p.splurgeDaysAllowed+' '+tr('allowed')+' · 80/20</div></div>'+
    '</div>';

    let timing='';
    if(state.timingBuckets){
      const b=state.timingBuckets.buckets, dcount=state.timingBuckets.days;
      const mx=Math.max(1,...b);
      const total=b.reduce((a,x)=>a+x,0);
      const late=b.slice(p.lateHour).reduce((a,x)=>a+x,0);
      const latePct=total?Math.round((late/total)*100):0;
      timing='<div class="section-title">'+tr('mealTiming')+'</div><div class="card">'+
        '<div style="font-family:var(--font-data);font-size:15px;">'+latePct+'% <span style="font-size:11px;color:var(--ink-faint);">'+tr('lateShare')+' '+p.lateHour+':00</span></div>'+
        '<div class="timing-chart">'+b.map((v,h)=>{
          const ht=Math.max(1,(v/mx)*100);
          return '<div class="timing-col"><div class="timing-bar '+(h>=p.lateHour?'late':'')+'" style="height:'+ht+'%" title="'+h+':00 — '+fmt(v/dcount)+'"></div></div>';
        }).join('')+'</div>'+
        '<div class="timing-axis">'+b.map((v,h)=>'<div>'+(h%6===0?h:'')+'</div>').join('')+'</div>'+
        '<div class="estimate-note">'+tr('timingNote')+'</div></div>';
    }

    const calTarget=Number(s.calories)||0;
    const max=Math.max(1,...state.weekDays.map(d=>d.totals.calories),calTarget);
    const chart='<div class="section-title">'+tr('last7days')+'</div><div class="card"><div class="week-chart">'+
      (calTarget?'<div class="target-line" style="bottom:'+Math.min(100,(calTarget/max)*100)+'%"></div>':'')+
      state.weekDays.map(d=>{
        const h=Math.max(2,(d.totals.calories/max)*100);
        const sp=d.totals.carbs_g>p.carbSplurgeDay;
        const lab=new Date(d.iso+'T00:00:00').toLocaleDateString(locale(),{weekday:'narrow'});
        return '<div class="week-bar-col"><div class="week-bar '+(sp?'splurge':'')+'" style="height:'+h+'%" title="'+d.iso+'"></div><div class="week-bar-label">'+lab+'</div></div>';
      }).join('')+'</div>'+
      '<div class="legend"><span><i class="swatch" style="background:var(--accent);height:8px;width:8px;border-radius:2px;"></i>'+tr('logForDay')+'</span>'+
      '<span><i class="swatch" style="background:var(--gold);height:8px;width:8px;border-radius:2px;"></i>'+tr('carbDaysUsed')+'</span></div></div>';

    return '<div class="section-title">'+tr('weekOf')+' '+displayDate(state.currentDate)+'</div>'+stats+chart+timing;
  }

  function renderWeightTab(){
    const p=state.plan||defaultPlan;
    const sorted=[...state.weights].sort((a,b)=>a.date.localeCompare(b.date));
    const series=computeTrend(sorted);
    const rate=trendRate(series);
    const last=series.length?series[series.length-1]:null;

    const stats='<div class="stat-grid">'+
      '<div class="stat"><div class="lab">'+tr('currentTrend')+'</div><div class="val">'+(last?fmt1(last.trend)+' '+tr('kgUnit'):'—')+'</div><div class="sub">'+(last?tr('rawWeight')+' '+fmt1(last.kg):'')+'</div></div>'+
      '<div class="stat"><div class="lab">'+tr('weeklyRate')+'</div><div class="val '+(rate==null?'':(rate<=-0.2?'good':rate>0.1?'bad':''))+'">'+(rate==null?'—':(rate>0?'+':'')+fmt1(rate)+' '+tr('kgUnit'))+'</div><div class="sub">'+(rate==null?tr('notEnoughData'):tr('vsTarget')+' −'+p.weeklyLossTarget+' '+tr('kgUnit')+tr('perWeek'))+'</div></div>'+
    '</div>';

    let chart='<div class="empty-state">'+tr('needTwoWeighins')+'</div>';
    if(series.length>=2){
      const w=560,h=150,pad=22;
      const vals=series.map(s=>s.kg).concat(series.map(s=>s.trend));
      const mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;
      const t0=new Date(series[0].date+'T00:00:00').getTime();
      const t1=new Date(series[series.length-1].date+'T00:00:00').getTime();
      const span=(t1-t0)||1;
      const X=d=>pad+((new Date(d+'T00:00:00').getTime()-t0)/span)*(w-pad*2);
      const Y=v=>pad+(1-(v-mn)/rg)*(h-pad*2);
      const rawPts=series.map(s=>X(s.date)+','+Y(s.kg)).join(' ');
      const trPts=series.map(s=>X(s.date)+','+Y(s.trend)).join(' ');
      chart='<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:150px;">'+
        '<polyline points="'+rawPts+'" fill="none" stroke="#C7C2AF" stroke-width="1.5" stroke-dasharray="3 3"/>'+
        '<polyline points="'+trPts+'" fill="none" stroke="#2F6F62" stroke-width="2.5"/>'+
        series.map(s=>'<circle cx="'+X(s.date)+'" cy="'+Y(s.kg)+'" r="2.5" fill="#C7C2AF"/>').join('')+
      '</svg>'+
      '<div class="legend"><span><i class="swatch" style="background:#C7C2AF;"></i>'+tr('rawWeight')+'</span>'+
      '<span><i class="swatch" style="background:#2F6F62;height:3px;"></i>'+tr('trendWeight')+'</span></div>';
    }

    const list=sorted.length?[...sorted].reverse().map(w=>
      '<div class="weight-row"><span>'+new Date(w.date+'T00:00:00').toLocaleDateString(locale(),{month:'short',day:'numeric',year:'numeric'})+'</span>'+
      '<span>'+w.kg+' '+tr('kgUnit')+' <button class="del" data-delw="'+w.date+'">×</button></span></div>').join('')
      :'<div class="empty-state">'+tr('noWeighins')+'</div>';

    return '<div class="section-title">'+tr('logYourWeight')+'</div>'+
      '<div class="card"><div class="weight-form">'+
        '<div class="f"><label class="field-label">'+tr('date')+'</label><input type="date" id="w-date" value="'+isoDate(new Date())+'"></div>'+
        '<div class="f"><label class="field-label">'+tr('weightKg')+'</label><input type="number" step="0.1" id="w-kg" placeholder="'+tr('weightPlaceholder')+'"></div>'+
        '<button class="btn" id="btn-add-weight">'+tr('save')+'</button></div>'+
        '<div class="estimate-note">'+tr('weighNote')+'</div></div>'+
      stats+
      '<div class="section-title">'+tr('trend')+'</div><div class="card">'+chart+'</div>'+
      '<div class="section-title">'+tr('history')+'</div><div class="card">'+list+'</div>';
  }

  // ================= Events =================
  function bind(){
    document.querySelectorAll('.lang-toggle button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
    document.getElementById('btn-settings').onclick=()=>{state.settingsOpen=true;render();};
    const bd=document.getElementById('settings-backdrop');
    if(bd)bd.onclick=e=>{if(e.target===bd){state.settingsOpen=false;render();}};
    const c=document.getElementById('btn-set-cancel');if(c)c.onclick=()=>{state.settingsOpen=false;render();};
    const sv=document.getElementById('btn-set-save');
    if(sv)sv.onclick=async()=>{
      const g=id=>document.getElementById(id).value;
      const n=id=>Number(document.getElementById(id).value)||0;
      state.settings={calories:g('set-calories'),protein:g('set-protein'),carbs:g('set-carbs'),fat:g('set-fat'),fiber:g('set-fiber'),sodium:g('set-sodium')};
      const notes=g('pl-notes');
      state.plan={...state.plan,
        proteinDaily:n('pl-proteinDaily'),proteinPerMeal:n('pl-proteinPerMeal'),
        carbEntryFlag:n('pl-carbEntryFlag'),carbSplurgeDay:n('pl-carbSplurgeDay'),
        splurgeDaysAllowed:n('pl-splurgeDaysAllowed'),weeklyLossTarget:Number(g('pl-weeklyLossTarget'))||0.5,
        lateHour:n('pl-lateHour'),calorieCeiling:n('pl-calorieCeiling')};
      if(state.lang==='he')state.plan.notes_he=notes;else state.plan.notes_en=notes;
      await storeSet('settings',state.settings); await storeSet('plan',state.plan);
      state.settingsOpen=false; render(); showToast(tr('settingsSaved'));
    };
    const cd=document.getElementById('btn-clear-data');if(cd)cd.onclick=clearAllData;
    document.querySelectorAll('[data-font]').forEach(b=>b.onclick=()=>setFont(b.dataset.font));

    document.getElementById('date-prev').onclick=async()=>{
      state.currentDate=shiftDate(state.currentDate,-1);resetInput();
      await Promise.all([loadDay(state.currentDate),loadWeek(),loadTiming()]);render();};
    document.getElementById('date-next').onclick=async()=>{
      state.currentDate=shiftDate(state.currentDate,1);resetInput();
      await Promise.all([loadDay(state.currentDate),loadWeek(),loadTiming()]);render();};
    const tl=document.getElementById('date-today');
    if(tl)tl.onclick=async()=>{state.currentDate=isoDate(new Date());resetInput();
      await Promise.all([loadDay(state.currentDate),loadWeek(),loadTiming()]);render();};

    document.querySelectorAll('.tab').forEach(t=>t.onclick=async()=>{
      state.activeTab=t.dataset.tab;
      if(state.activeTab==='weight')await loadWeights();
      if(state.activeTab==='week')await Promise.all([loadWeek(),loadTiming()]);
      render();});

    if(state.activeTab==='log'){
      const mm=document.getElementById('mode-manual'),mp=document.getElementById('mode-photo');
      if(mm)mm.onclick=()=>{state.logMode='manual';resetInput();render();};
      if(mp)mp.onclick=()=>{state.logMode='photo';resetInput();render();};

      const em=document.getElementById('btn-est-manual');
      if(em)em.onclick=async()=>{
        const desc=document.getElementById('in-desc').value.trim();
        if(!desc){state.error=tr('describeFirst');render();return;}
        const meal=document.getElementById('in-meal').value;
        const time=document.getElementById('in-time').value||nowTime();
        state.loading=true;state.error=null;render();
        try{const r=await estimateNutrition({description:desc,meal});
          state.reviewBase={...r,meal,time,description:desc,source:'manual'};state.reviewScale=1;
        }catch(e){state.error=e.message||tr('couldNotEstimate');}
        state.loading=false;render();};

      const pd=document.getElementById('photo-drop'),pf=document.getElementById('in-photo-file');
      if(pd)pd.onclick=()=>pf.click();
      if(pf)pf.onchange=async e=>{const f=e.target.files[0];if(!f)return;
        state.photoMediaType=f.type;state.photoBase64=await fileToBase64(f);render();};
      const ep=document.getElementById('btn-est-photo');
      if(ep)ep.onclick=async()=>{
        const meal=document.getElementById('in-meal-photo').value;
        const time=document.getElementById('in-time-photo').value||nowTime();
        const note=document.getElementById('in-photo-note').value.trim();
        state.loading=true;state.error=null;render();
        try{const r=await estimateNutrition({meal,imageBase64:state.photoBase64,imageMediaType:state.photoMediaType,note});
          const items=(r.items||[]).map(i=>i.name).join(', ');
          state.reviewBase={...r,meal,time,description:items||tr('photoOfPlate'),source:'photo'};state.reviewScale=1;
        }catch(e){state.error=e.message||tr('couldNotEstimate');}
        state.loading=false;render();};

      document.querySelectorAll('[data-scale]').forEach(b=>b.onclick=()=>{
        state.reviewScale=Number(b.dataset.scale);render();});

      const ca=document.getElementById('btn-confirm-add');
      if(ca)ca.onclick=async()=>{
        const n=id=>Number(document.getElementById(id).value)||0;
        const r=state.reviewBase;
        const entry={id:'e'+Date.now()+Math.random().toString(36).slice(2,6),time:r.time||nowTime(),
          meal:r.meal,description:r.description,source:r.source,confidence:r.confidence,
          calories:n('rv-calories'),protein_g:n('rv-protein'),carbs_g:n('rv-carbs'),
          fat_g:n('rv-fat'),fiber_g:n('rv-fiber'),sodium_mg:n('rv-sodium')};
        await addEntryToLog(entry);await loadWeek();await loadTiming();
        resetInput();render();showToast(tr('addedToLog'));};
      const dc=document.getElementById('btn-discard');
      if(dc)dc.onclick=()=>{state.reviewBase=null;state.reviewScale=1;render();};

      document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteEntry(b.dataset.del));
      document.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{
        const e=state.dayEntries.find(x=>x.id===b.dataset.star);if(e)addFavourite(e);});
      document.querySelectorAll('[data-fav]').forEach(el=>el.onclick=ev=>{
        if(ev.target.dataset.favdel){removeFavourite(ev.target.dataset.favdel);return;}
        const f=state.favourites.find(x=>x.id===el.dataset.fav);if(f)logFavourite(f);});
    }

    if(state.activeTab==='weight'){
      const aw=document.getElementById('btn-add-weight');
      if(aw)aw.onclick=async()=>{
        const d=document.getElementById('w-date').value;
        const kg=Number(document.getElementById('w-kg').value);
        if(!d||!kg){showToast(tr('enterDateWeight'));return;}
        await addWeight(d,kg);showToast(tr('weightSaved'));};
      document.querySelectorAll('[data-delw]').forEach(b=>b.onclick=()=>deleteWeight(b.dataset.delw));
    }
  }
  function resetInput(){state.reviewBase=null;state.reviewScale=1;state.error=null;state.photoBase64=null;state.photoMediaType=null;}

  // ================= Init =================
  async function init(){
    render();
    await loadLang(); await loadFont();
    await Promise.all([loadSettings(),loadPlan(),loadFavs(),loadDay(state.currentDate),loadWeek(),loadWeights(),loadTiming()]);
    render();
  }
  init();
})();
</script>
</body>
</html>
